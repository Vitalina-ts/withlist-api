name: Python API CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff style check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lint.txt
      - name: Install Ruff
        run: python -m pip install -r requirements-lint.txt
      - name: Check Python code
        run: ruff check .

  tests:
    name: API tests with PostgreSQL and Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost:5432
      DB_NAME: wishlist_test
      DB_SSLMODE: disable
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-test-signing-key
      ALGORITHM: HS256
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d wishlist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-lint.txt
      - name: Install API and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -v

  docker-build:
    name: Docker build
    if: github.event_name == 'pull_request'
    needs: [lint, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for PR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false

  docker-publish:
    name: Docker publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Generate GHCR tags and OCI labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/vitalina-ts/wishlist-api
          flavor: latest=auto
          tags: |
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Require a supported ref
        if: steps.metadata.outputs.tags == ''
        run: |
          echo 'No Docker tags generated. Release Git tags must use SemVer.'
          exit 1
      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
