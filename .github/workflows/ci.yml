name: Python API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff style check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lint.txt
      - name: Install Ruff
        run: python -m pip install -r requirements-lint.txt
      - name: Check Python code
        run: ruff check .

  tests:
    name: API tests with PostgreSQL and Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost:5432
      DB_NAME: wishlist_test
      DB_SSLMODE: disable
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-test-signing-key
      ALGORITHM: HS256
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d wishlist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-lint.txt
      - name: Install API and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -v
