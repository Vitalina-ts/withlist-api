
# CI для перевірки Python API
name: Python API CI

# Запуск при push або pull request у main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Доступ тільки для читання репозиторію
permissions:
  contents: read

jobs:
  # Перевірка стилю Python-коду
  lint:
    name: Ruff style check
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # Отримуємо код з репозиторію
      - uses: actions/checkout@v4.2.2

      # Встановлюємо Python 3.11 та кешуємо pip
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lint.txt

      # Встановлення Ruff
      - name: Install Ruff
        run: python -m pip install -r requirements-lint.txt

      # Перевірка коду на помилки стилю
      - name: Check Python code
        run: ruff check .

  # Запуск тестів API
  tests:
    name: API tests with PostgreSQL and Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Змінні для тестового середовища
    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost:5432
      DB_NAME: wishlist_test
      DB_SSLMODE: disable
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-test-signing-key
      ALGORITHM: HS256

    # Сервіси, потрібні для тестів
    services:
      # Тестова база даних PostgreSQL
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432

        # Перевірка, чи база готова до роботи
        options: >-
          --health-cmd "pg_isready -U ci_user -d wishlist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      # Redis для роботи API під час тестів
      redis:
        image: redis:7
        ports:
          - 6379:6379

        # Перевірка, чи Redis запущений
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      # Завантажуємо код проєкту
      - uses: actions/checkout@v4.2.2

      # Налаштовуємо Python і кеш залежностей
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-lint.txt

      # Встановлюємо залежності для тестування
      - name: Install API and test dependencies
        run: python -m pip install -r requirements-test.txt

      # Перевіряємо сумісність встановлених пакетів
      - name: Check dependency compatibility
        run: python -m pip check

      # Запускаємо тести через pytest
      - name: Run tests
        run: python -m pytest -v
