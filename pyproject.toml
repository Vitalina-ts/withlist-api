[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv-ci"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["F401"] # Imports intentionally check installed dependencies.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
